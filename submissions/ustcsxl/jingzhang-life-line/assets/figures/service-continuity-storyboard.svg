<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
<title id="title">Three-state public-service continuity storyboard</title>
<desc id="desc">A conceptual, non-site-specific sequence: normal assisted service, degraded offline service, and visible human takeover. It is not a site observation, approved design, completed pilot, or evidence of public consent.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#102d42"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
</defs>
<rect width="1800" height="820" rx="32" fill="url(#bg)"/>
<path d="M95 670 C330 610 520 715 760 635 S1210 565 1705 640" fill="none" stroke="#31c6d4" stroke-width="18" opacity=".72"/>
<path d="M95 700 C330 640 520 745 760 665 S1210 595 1705 670" fill="none" stroke="#b9dce0" stroke-width="5" stroke-dasharray="22 18" opacity=".55"/>
<!-- three state cards -->
<g filter="url(#shadow)">
 <rect x="85" y="90" width="510" height="510" rx="28" fill="#f6f8f7"/>
 <rect x="645" y="90" width="510" height="510" rx="28" fill="#f6f8f7"/>
 <rect x="1205" y="90" width="510" height="510" rx="28" fill="#f6f8f7"/>
</g>
<!-- state 01 normal: digital + human desk -->
<g transform="translate(85 90)">
 <rect width="510" height="72" rx="28" fill="#31c6d4"/><rect y="44" width="510" height="28" fill="#31c6d4"/>
 <text x="32" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#071523">01</text>
 <rect x="48" y="122" width="188" height="176" rx="18" fill="#dcecef" stroke="#17324d" stroke-width="5"/>
 <rect x="78" y="152" width="128" height="82" rx="10" fill="#17324d"/><circle cx="142" cy="260" r="13" fill="#31c6d4"/>
 <rect x="276" y="206" width="174" height="92" rx="16" fill="#ffe7d9" stroke="#e36c4d" stroke-width="5"/>
 <circle cx="333" cy="174" r="28" fill="#e36c4d"/><path d="M300 266q33-56 66 0" fill="none" stroke="#17324d" stroke-width="10" stroke-linecap="round"/>
 <path d="M80 358h350" stroke="#31c6d4" stroke-width="16" stroke-linecap="round"/><path d="M80 405h250" stroke="#98bfc4" stroke-width="12" stroke-linecap="round"/>
 <circle cx="96" cy="486" r="34" fill="#31c6d4"/><path d="M82 486l12 12 22-28" fill="none" stroke="#071523" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="184" cy="486" r="34" fill="#31c6d4"/><path d="M168 487h32M184 471v32" stroke="#071523" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- state 02 degraded: offline rules, paper and phone -->
<g transform="translate(645 90)">
 <rect width="510" height="72" rx="28" fill="#f2c94c"/><rect y="44" width="510" height="28" fill="#f2c94c"/>
 <text x="32" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#071523">02</text>
 <rect x="55" y="126" width="180" height="210" rx="12" fill="#fff" stroke="#17324d" stroke-width="5"/>
 <path d="M83 170h124M83 212h124M83 254h92" stroke="#98bfc4" stroke-width="10" stroke-linecap="round"/>
 <path d="M304 132c-32 0-54 26-54 58v120c0 32 22 58 54 58h72c32 0 54-26 54-58V190c0-32-22-58-54-58z" fill="#17324d"/>
 <rect x="280" y="168" width="120" height="132" rx="12" fill="#f6f8f7"/><circle cx="340" cy="330" r="12" fill="#f2c94c"/>
 <path d="M82 405h348" stroke="#f2c94c" stroke-width="16" stroke-linecap="round"/><path d="M82 452h290" stroke="#c9b76f" stroke-width="12" stroke-linecap="round"/>
 <circle cx="96" cy="520" r="34" fill="#f2c94c"/><path d="M76 520h40" stroke="#071523" stroke-width="9" stroke-linecap="round"/>
 <circle cx="184" cy="520" r="34" fill="#f2c94c"/><path d="M169 505l30 30M199 505l-30 30" stroke="#071523" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- state 03 human takeover: visible stop, staffed lane, receipt -->
<g transform="translate(1205 90)">
 <rect width="510" height="72" rx="28" fill="#e36c4d"/><rect y="44" width="510" height="28" fill="#e36c4d"/>
 <text x="32" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">03</text>
 <circle cx="145" cy="185" r="52" fill="#e36c4d"/><path d="M105 185h80" stroke="#fff" stroke-width="18" stroke-linecap="round"/>
 <rect x="255" y="120" width="195" height="220" rx="20" fill="#ffe7d9" stroke="#e36c4d" stroke-width="5"/>
 <circle cx="352" cy="178" r="32" fill="#e36c4d"/><path d="M304 292q48-82 96 0" fill="none" stroke="#17324d" stroke-width="12" stroke-linecap="round"/>
 <path d="M75 397h360" stroke="#e36c4d" stroke-width="16" stroke-linecap="round"/>
 <rect x="75" y="440" width="360" height="76" rx="14" fill="#fff" stroke="#17324d" stroke-width="4"/><path d="M104 470h172M104 492h120" stroke="#98bfc4" stroke-width="8" stroke-linecap="round"/><path d="M345 470l18 18 36-42" fill="none" stroke="#e36c4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- handover arrows -->
<g fill="none" stroke="#f6f8f7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
 <path d="M605 345h30m-14-15 15 15-15 15"/><path d="M1165 345h30m-14-15 15 15-15 15"/>
</g>
<!-- explicit concept boundary -->
<rect x="72" y="738" width="1656" height="42" rx="20" fill="#071523" stroke="#98bfc4" stroke-width="2"/>
<text x="900" y="767" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="1.2" fill="#d7eef0">CONCEPT SEQUENCE · NOT SITE OBSERVATION · NOT APPROVAL · NOT COMPLETED PILOT</text>
</svg>