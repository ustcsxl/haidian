<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="t d"><title id="t">Release and evidence gates</title><desc id="d">Eight auditable gates from authorization through exit receipt. A pilot cannot expand when a gate is missing.</desc><rect width="1600" height="720" rx="28" fill="#071523"/><text x="72" y="82" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#f4f7f5">RELEASE / EVIDENCE GATES</text><text x="72" y="124" font-family="Arial,sans-serif" font-size="22" fill="#b9dce0">No evidence, no expansion · concept contract, not implementation approval</text><g font-family="Arial,sans-serif" font-size="23" font-weight="700"><g transform="translate(72 180)"><rect width="330" height="176" rx="20" fill="#31c6d4"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">1</text><text x="92" y="52" fill="#071523">AUTHORIZATION</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">owner and stop right</text></g><g transform="translate(450 180)"><rect width="330" height="176" rx="20" fill="#f2c94c"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">2</text><text x="92" y="52" fill="#071523">ACCESS</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">fire and accessibility</text></g><g transform="translate(828 180)"><rect width="330" height="176" rx="20" fill="#7ad7a8"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">3</text><text x="92" y="52" fill="#071523">DATA</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">minimum and deletable</text></g><g transform="translate(1206 180)"><rect width="330" height="176" rx="20" fill="#e36c4d"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">4</text><text x="92" y="52" fill="#071523">HUMAN</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">staffed equivalent</text></g><g transform="translate(72 415)"><rect width="330" height="176" rx="20" fill="#b9dce0"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">5</text><text x="92" y="52" fill="#071523">COST</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">five-year lifecycle</text></g><g transform="translate(450 415)"><rect width="330" height="176" rx="20" fill="#31c6d4"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">6</text><text x="92" y="52" fill="#071523">TEST</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">failure injection</text></g><g transform="translate(828 415)"><rect width="330" height="176" rx="20" fill="#f2c94c"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">7</text><text x="92" y="52" fill="#071523">REVIEW</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">independent evidence</text></g><g transform="translate(1206 415)"><rect width="330" height="176" rx="20" fill="#e36c4d"/><circle cx="52" cy="52" r="28" fill="#071523"/><text x="52" y="61" text-anchor="middle" fill="#fff">8</text><text x="92" y="52" fill="#071523">EXIT</text><path d="M30 98h270M30 128h220" stroke="#17324d" stroke-width="9" stroke-linecap="round" opacity=".45"/><text x="30" y="159" font-size="17" font-weight="400" fill="#17324d">rollback and receipt</text></g></g><rect x="72" y="656" width="1456" height="34" rx="17" fill="#102d42"/><text x="800" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#d7eef0">CONCEPT / PROVISIONAL · NOT A PROCUREMENT, FUNDING OR OPERATOR COMMITMENT</text></svg>