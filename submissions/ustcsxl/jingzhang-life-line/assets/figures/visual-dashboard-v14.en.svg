<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Jingzhang Life-Line v1.4.2 evidence dashboard</title>
<desc id="desc">An English evidence dashboard with six core design-model indicators, three closed repairs and six activation gates. All geometry remains provisional.</desc>
<rect width="1600" height="980" rx="30" fill="#071523"/>
<text x="64" y="76" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#fff">JINGZHANG LIFE-LINE v1.4.2</text>
<text x="64" y="116" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#31c6d4">ONE LIFE-LINE · FIVE INTERFACES · THREE STATIONS · THREE FIRST-YEAR PILOTS</text>
<rect x="64" y="154" width="1472" height="92" rx="18" fill="#0e2a42" stroke="#315c6b" stroke-width="2"/>
<text x="92" y="197" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">EXCHANGE IN NORMALITY · CARE UNDER PRESSURE · DEGRADE ON FAILURE · EXIT UNDER DISPUTE</text>
<text x="92" y="226" font-family="Arial,sans-serif" font-size="15" fill="#cde7ea">Every public AI scenario binds minimum data, visible human authority, stop / rollback and an account-free equivalent.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(64 278)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">11.41 km²</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">PROVISIONAL SITE MODEL</text></g>
 <g transform="translate(570 278)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">29.6%</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">GREEN-SPACE CONCEPT</text></g>
 <g transform="translate(1076 278)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">17.7%</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">PUBLIC-SPACE CONCEPT</text></g>
 <g transform="translate(64 410)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">5</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">REGIONAL INTERFACES</text></g>
 <g transform="translate(570 410)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">3</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">REVERSIBLE FIRST-YEAR PILOTS</text></g>
 <g transform="translate(1076 410)"><rect width="460" height="110" rx="18" fill="#fff"/><text x="24" y="48" font-size="32" font-weight="700" fill="#0b1f33">7</text><text x="24" y="78" font-size="15" font-weight="700" fill="#526c78">NON-SUBSTITUTABLE RESPONSIBILITY SEATS</text></g>
</g>
<rect x="64" y="552" width="1472" height="152" rx="20" fill="#0f3549" stroke="#315c6b" stroke-width="2"/>
<text x="92" y="594" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#31c6d4">THREE CLOSED REPAIRS</text>
<g font-family="Arial,sans-serif"><circle cx="108" cy="644" r="22" fill="#31c6d4"/><text x="108" y="651" text-anchor="middle" font-size="14" font-weight="700" fill="#071523">01</text><text x="146" y="638" font-size="17" font-weight="700" fill="#fff">CJK-SAFE CHINESE</text><text x="146" y="665" font-size="13" fill="#cde7ea">font-independent visible boards + searchable semantics</text><circle cx="602" cy="644" r="22" fill="#72e3b2"/><text x="602" y="651" text-anchor="middle" font-size="14" font-weight="700" fill="#071523">02</text><text x="640" y="638" font-size="17" font-weight="700" fill="#fff">REGIONAL INTERFACES</text><text x="640" y="665" font-size="13" fill="#cde7ea">exchange, evidence, responsibility, stop and non-commitment</text><circle cx="1096" cy="644" r="22" fill="#f6be5c"/><text x="1096" y="651" text-anchor="middle" font-size="14" font-weight="700" fill="#071523">03</text><text x="1134" y="638" font-size="17" font-weight="700" fill="#fff">HANDOVER-READY STATIONS</text><text x="1134" y="665" font-size="13" fill="#cde7ea">named access, flows, isolation, stop and S01–S12</text></g>
<rect x="64" y="736" width="1472" height="176" rx="20" fill="#fff" stroke="#cbd7df" stroke-width="2"/>
<text x="92" y="778" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">EVIDENCE GATES · MISSING ONE = NOT ACTIVATED</text>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#0b1f33"><g transform="translate(92 812)"><rect width="430" height="68" rx="13" fill="#eaf2f1" stroke="#9eb5bf"/><text x="18" y="29">AUTHORIZATION / SITE</text><text x="18" y="52" font-size="12" fill="#e36c4d">owner + final stop right</text></g><g transform="translate(585 812)"><rect width="430" height="68" rx="13" fill="#eaf2f1" stroke="#9eb5bf"/><text x="18" y="29">PUBLIC SERVICE STAFFING</text><text x="18" y="52" font-size="12" fill="#e36c4d">account-free staffed equivalent</text></g><g transform="translate(1078 812)"><rect width="430" height="68" rx="13" fill="#eaf2f1" stroke="#9eb5bf"/><text x="18" y="29">FIRE / ACCESSIBILITY</text><text x="18" y="52" font-size="12" fill="#e36c4d">professional verification</text></g></g>
<rect x="64" y="936" width="1472" height="22" rx="11" fill="#102d42"/><text x="800" y="953" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#d7eef0">CONCEPT / PROVISIONAL · NOT APPROVAL, FUNDING, PROCUREMENT OR OPERATOR COMMITMENT</text>
