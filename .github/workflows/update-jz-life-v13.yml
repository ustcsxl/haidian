name: Temporary JZ Life v1.3 updater
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-jz-life-v13.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Read temporary updater payload
        uses: actions/checkout@v4
        with:
          ref: main
          path: payload
          fetch-depth: 1
      - name: Check out proposal branch
        uses: actions/checkout@v4
        with:
          ref: submission/ustcsxl/jingzhang-life-line
          path: work
          fetch-depth: 0
      - name: Apply reviewed v1.3 update
        shell: bash
        run: |
          cat payload/.github/jz-life-v13/updater.part* > /tmp/updater.b64
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          Path('/tmp/update_jz_life_v13.py').write_bytes(
              zlib.decompress(base64.b64decode(Path('/tmp/updater.b64').read_text()))
          )
          PY
          cd work
          python /tmp/update_jz_life_v13.py
      - name: Commit and push proposal update
        shell: bash
        working-directory: work
        run: |
          git config user.name "JZ Life-Line Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add submissions/ustcsxl/jingzhang-life-line
          git diff --cached --check
          git commit -m "feat(submission): repair CJK review layer and deepen delivery contracts"
          git push origin HEAD:submission/ustcsxl/jingzhang-life-line
